[project]
name = "laya-play"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Teo Cheng Lim", email = "teochenglim@gmail.com" }
]
requires-python = ">=3.13.15"
dependencies = [
    "laya[serve]>=0.3.20",
    # Direct (if redundant) dependency: tool.uv.sources below only overrides
    # the index for packages the project declares directly, not ones pulled
    # in transitively through laya[serve].
    "torch>=2.0.0",
]

[project.scripts]
laya-play = "laya_play:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

# The default PyPI torch wheel on Linux bundles the full CUDA toolkit
# (cublas, cudnn, cusolver, nccl, ...) -- several GB nobody asked for, since
# this app runs CPU-only (no GPU in the containers or in local dev). macOS
# already gets a CUDA-free wheel by default, so this only redirects Linux.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
